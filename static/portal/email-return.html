<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>이메일 로그인 확인</title>
<style>body{font:18px system-ui;max-width:520px;margin:12vh auto;padding:24px;background:#f4f7f4;color:#1c302a}p{line-height:1.7}a:focus-visible{outline:3px solid #d87910;outline-offset:3px}</style>
<h1>이메일 로그인</h1><p>메일 링크를 확인하고 바로 연결합니다. 이 링크는 10분 동안 한 번만 사용할 수 있습니다.</p>
<p id="result" role="status" aria-live="polite">이메일을 확인하고 있습니다.</p><a href="/portal">포털로 이동</a>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const code = params.get('code'), state = params.get('state');
history.replaceState(null, '', '/portal/email-return');
async function completeLogin() {
 const result = document.getElementById('result');
 try {
  if (!code || !state) throw new Error('올바른 이메일 링크를 다시 열어 주세요.');
  const response = await fetch('/api/portal/auth/email-exchange', {method:'POST',cache:'no-store',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,state})});
  const data = await response.json();
  if (!response.ok) throw new Error(data.detail || '이메일 확인에 실패했습니다.');
  location.replace('/portal');
 } catch (e) {
  result.textContent = e.message + ' 포털에서 이메일을 다시 입력해 새 링크를 받아 주세요.';
 }
}
completeLogin();
</script></html>
