<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Google 로그인 확인</title>
<style>body{font:18px system-ui;max-width:520px;margin:12vh auto;padding:24px;background:#f4f7f4;color:#1c302a}p{line-height:1.7}a:focus-visible{outline:3px solid #d87910;outline-offset:3px}</style>
<h1>Google 로그인</h1><p>Google 계정을 확인하고 포털로 연결합니다.</p>
<p id="result" role="status" aria-live="polite">Google 로그인을 확인하고 있습니다.</p><a href="/portal">포털로 이동</a>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const code = params.get('code');
const cancelled = params.has('error') || params.has('error_description');
history.replaceState(null, '', '/portal/google-return');
async function completeLogin() {
 const result = document.getElementById('result');
 try {
  if (cancelled) throw new Error('Google 로그인이 취소되었거나 완료되지 않았습니다.');
  if (!code) throw new Error('포털에서 Google 로그인을 다시 시작해 주세요.');
  const response = await fetch('/api/portal/auth/google-exchange', {method:'POST',cache:'no-store',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
  const data = await response.json();
  if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Google 로그인을 확인하지 못했습니다. 다시 시도해 주세요.');
  location.replace('/portal');
 } catch (e) {
  result.textContent = e.message;
 }
}
completeLogin();
</script></html>
